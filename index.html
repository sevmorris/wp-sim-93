<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FL2601</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Lora:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">

  <!-- ════════════════════════════════════════════════════════════════════
       CACHE-BUSTING / VERSION PIN
       Every local module is pinned to one version, so a bump invalidates the
       whole ES module graph at once (engine + world + state + utils + config
       + filesystem) rather than just the entry file. A fresh engine.js paired
       with a stale world.js renders a blank page when the exports disagree.

       The pin is fetched at boot from version.json rather than being written
       here, because a pin that lives in this file cannot bust this file: a
       browser holding a cached index.html keeps requesting the old ?v= URLs
       forever, and — since ?v= is not content-addressed — those URLs now
       serve different bytes than they did, which is how a mixed graph
       happens. version.json is fetched with cache:'no-store', so it is the
       one request that always reaches the origin.

       FALLBACK below is the baked-in pin, used when version.json cannot be
       read — offline, origin down, or slow. It is not a nicety: without it a
       network failure means no game at all rather than an older game.

       TO DEPLOY: bump version.json, FALLBACK below, and VERSION in config.js.
       Keep all three identical.
       ════════════════════════════════════════════════════════════════════ -->
  <script>
  (function () {
    var FALLBACK = '260728.05';
    var MODULES  = ['config', 'filesystem', 'state', 'utils', 'world'];
    var booted   = false;

    function boot(version, source) {
      if (booted) return;
      booted = true;
      window.__PIN = { version: version, source: source };

      var map = { imports: {} };
      for (var i = 0; i < MODULES.length; i++)
        map.imports['./' + MODULES[i] + '.js'] = './' + MODULES[i] + '.js?v=' + version;

      // The import map has to be in place before the first module load is
      // triggered, which is why the entry script is appended after it here
      // rather than sitting statically in the markup.
      var im = document.createElement('script');
      im.type = 'importmap';
      im.textContent = JSON.stringify(map);
      document.head.appendChild(im);

      var entry = document.createElement('script');
      entry.type = 'module';
      entry.src  = './engine.js?v=' + version;
      document.head.appendChild(entry);
    }

    // Never let the network hold the game hostage. If version.json is slow,
    // boot on the baked-in pin and let the late reply lose the race.
    var timer = setTimeout(function () { boot(FALLBACK, 'fallback:timeout'); }, 1500);

    try {
      fetch('./version.json', { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) return { bad: 'bad-response' };
          // A captive portal or ISP interstitial answers 200 with HTML. The
          // document is cached and this fetch isn't, so it is exactly the
          // request such a network gets to intercept — parse failure has to
          // land in the fallback, not throw the boot away.
          return r.json().then(function (j) { return j; },
                               function ()  { return { bad: 'bad-json' }; });
        })
        .then(function (j) {
          clearTimeout(timer);
          if      (j && j.bad)     boot(FALLBACK, 'fallback:' + j.bad);
          else if (j && j.version) boot(j.version, 'version.json');
          else                     boot(FALLBACK, 'fallback:bad-response');
        })
        .catch(function () { clearTimeout(timer); boot(FALLBACK, 'fallback:fetch-failed'); });
    } catch (e) {
      clearTimeout(timer);
      boot(FALLBACK, 'fallback:no-fetch');
    }
  })();
  </script>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="output"></div>
  <div id="input-row">
    <span id="prompt"></span>
    <input id="cmd-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" aria-label="terminal input">
  </div>
</div>

<div id="crt-overlay">
  <div id="crt-screen">
    <div id="crt-bar"></div>
    <div id="crt-body"></div>
    <div id="crt-foot">[ PRESS ANY KEY ]<span class="cursor"></span></div>
  </div>
</div>

<!-- The entry module is injected by the pin bootstrap in <head>, after the
     import map it depends on. -->
</body>
</html>
