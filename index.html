<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FL2601</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Lora:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">

  <!-- ════════════════════════════════════════════════════════════════════
       CACHE-BUSTING / VERSION PIN
       The version query below is appended to EVERY local module via this
       import map, so a version bump invalidates the whole ES module graph
       at once (engine + world + state + utils + config + filesystem), not
       just the entry file. This prevents a fresh engine.js from loading a
       stale world.js (which renders a blank page when exports don't match).

       TO DEPLOY: bump the version in ONE place — find/replace 260727.03
       below AND in the <script src> tag, plus VERSION in config.js. Keep
       all three identical. (A project-wide replace of the old version
       string does it in one shot.)
       ════════════════════════════════════════════════════════════════════ -->
  <script type="importmap">
  {
    "imports": {
      "./config.js":     "./config.js?v=260727.03",
      "./filesystem.js": "./filesystem.js?v=260727.03",
      "./state.js":      "./state.js?v=260727.03",
      "./utils.js":      "./utils.js?v=260727.03",
      "./world.js":      "./world.js?v=260727.03"
    }
  }
  </script>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="output"></div>
  <div id="input-row">
    <span id="prompt"></span>
    <input id="cmd-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" aria-label="terminal input">
  </div>
</div>

<div id="crt-overlay">
  <div id="crt-screen">
    <div id="crt-bar"></div>
    <div id="crt-body"></div>
    <div id="crt-foot">[ PRESS ANY KEY ]<span class="cursor"></span></div>
  </div>
</div>

<script type="module" src="./engine.js?v=260727.03"></script>
</body>
</html>
